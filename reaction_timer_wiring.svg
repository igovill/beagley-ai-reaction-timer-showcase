<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
<title id="title">BeagleY-AI reaction timer wiring</title>
<desc id="desc">Connections from the supplied wiring table, checked against BeagleBoard and Microchip pinouts. Physical Beagle pins 1 and 6 supply shared 3.3 volt and ground rails. Pins 19, 21, 23 and 24 connect to MCP3208 pins 11, 12, 13 and 10 respectively. Joystick Xout and Yout connect to ADC channels 0 and 1. MCP3208 VDD and VREF connect to 3.3 volts; AGND and DGND connect to ground.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245ba9"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#167b61"/></marker>
</defs>
<rect width="1800" height="1080" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#1e293b">
<text x="70" y="66" font-size="38" font-weight="bold" fill="#1e293b" text-anchor="start">Reaction timer wiring</text>
<text x="70" y="108" font-size="23" font-weight="normal" fill="#1e293b" text-anchor="start">BeagleY-AI  •  MCP3208-CI/P  •  analog joystick</text>
<text x="70" y="204" font-size="21" font-weight="bold" fill="#be3636" text-anchor="start">3.3 V  /  breadboard positive rail</text>
<path d="M170 225 L1580 225" fill="none" stroke="#be3636" stroke-width="4" stroke-linecap="round"/>
<text x="70" y="1030" font-size="21" font-weight="bold" fill="#475569" text-anchor="start">GND  /  breadboard ground rail</text>
<path d="M280 988 L1580 988" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
<rect x="70" y="300" width="420" height="590" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="755" y="300" width="380" height="590" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1400" y="300" width="330" height="590" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="103" y="390" font-size="29" font-weight="bold" fill="#1e293b" text-anchor="start">BeagleY-AI</text>
<text x="103" y="425" font-size="18" font-weight="normal" fill="#1e293b" text-anchor="start">40 pin header</text>
<text x="945" y="390" font-size="29" font-weight="bold" fill="#1e293b" text-anchor="middle">MCP3208</text>
<text x="945" y="425" font-size="19" font-weight="normal" fill="#1e293b" text-anchor="middle">12 bit SPI ADC</text>
<text x="1565" y="390" font-size="26" font-weight="bold" fill="#1e293b" text-anchor="middle">Analog joystick</text>
<text x="1565" y="425" font-size="18" font-weight="normal" fill="#1e293b" text-anchor="middle">X / Y potentiometers</text>
<path d="M170 225 L170 300" fill="none" stroke="#be3636" stroke-width="3" stroke-linecap="round"/>
<circle cx="170" cy="225" r="5" fill="#be3636"/>
<circle cx="170" cy="300" r="5" fill="white" stroke="#be3636" stroke-width="3"/>
