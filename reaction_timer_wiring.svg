<circle cx="1400" cy="580" r="5" fill="white" stroke="#167b61" stroke-width="3"/>
<text x="1110" y="587" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="end">2 · CH1</text>
<text x="1427" y="587" font-size="23" font-weight="bold" fill="#1e293b" text-anchor="start">Yout</text>
<text x="1267" y="562" font-size="17" font-weight="normal" fill="#167b61" text-anchor="middle">Analog voltage</text>
