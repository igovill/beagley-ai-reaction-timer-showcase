<circle cx="1400" cy="490" r="5" fill="white" stroke="#167b61" stroke-width="3"/>
<text x="1110" y="497" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="end">1 · CH0</text>
<text x="1427" y="497" font-size="23" font-weight="bold" fill="#1e293b" text-anchor="start">Xout</text>
<text x="1267" y="472" font-size="17" font-weight="normal" fill="#167b61" text-anchor="middle">Analog voltage</text>
<path d="M1400 580 L1135 580" fill="none" stroke="#167b61" stroke-width="3" stroke-linecap="round" marker-end="url(#green)"/>
